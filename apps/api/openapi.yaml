openapi: 3.0.3
info:
  title: video-transcoder API
  description: >
    Express + TypeScript (ESM) API with session-based authentication,
    Drizzle (Postgres), Redis and presigned S3 video uploads.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api/v1

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Registration, login and session-based authentication
  - name: Uploads
    description: Presigned upload URLs for video files
  - name: Logs
    description: Transcoder logs stored in ClickHouse

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Always returns 200 if the process is running.
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          uptime:
                            type: integer
                            description: Process uptime in seconds
                            example: 42

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Checks connectivity to Postgres and Redis.
      responses:
        "200":
          description: Ready - all dependencies are up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"
        "503":
          description: Not ready - one or more dependencies are down
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      description: On success, sets the `sid` session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=s%3A...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        example: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /uploads/video/presign:
    post:
      tags: [Uploads]
      summary: Create a presigned S3 upload for a video file
      description: >
        Returns a presigned `PUT` URL (generated from a `PutObjectCommand`)
        that the client uploads the raw video file to directly. The request
        must send the returned `headers` (`Content-Type: video/mp4`) or S3
        rejects it with a signature mismatch. A `videos` row is created for
        the upload with status `uploading` (it is marked `failed` if the URL
        cannot be generated); the worker and transcoder advance it from there.
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Presigned upload created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PresignedUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The upload could not be recorded or the URL could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /logs/{videoId}:
    get:
      tags: [Logs]
      summary: Fetch the transcoder logs of a video
      description: >
        Returns the log lines the transcoder produced for one of the caller's
        videos. They are read from the ClickHouse `log_events` table that
        `apps/logs-consumer` fills from Kafka. Lines are ordered by arrival
        time (then by the producer timestamp) and paged with `limit` /
        `offset`. A video that does not exist or belongs to another user
        returns 404.
      security:
        - cookieAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: jobId
          in: query
          description: Only return logs of this transcoding job
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: A page of log events (empty if none were recorded yet)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogsPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Video not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The logs could not be fetched from ClickHouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Session cookie set by `POST /auth/login`.

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    type: object
                    description: Zod flattened field errors
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        requestId:
          type: string
      required: [success, message, data]

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            success:
              type: boolean
              example: false
            data:
              nullable: true
              example: null

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, name, createdAt, updatedAt]

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [email, password, name]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    PresignedUpload:
      type: object
      properties:
        videoId:
          type: string
          format: uuid
          description: >
            Id of the tracked `videos` row created for this upload (status
            `uploading`).
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Headers the upload request must send
          additionalProperties:
            type: string
          example:
            Content-Type: video/mp4
        key:
          type: string
        contentType:
          type: string
          example: video/mp4
        expiresIn:
          type: integer
          description: Seconds until the presigned URL expires
          example: 300
      required: [videoId, url, method, headers, key, contentType, expiresIn]

    LogEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        videoId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
          nullable: true
        log:
          type: string
          example: "Transcoding 720p..."
        metadata:
          type: object
          nullable: true
          description: >
            Extra data stored by the consumer: `producedAt` (when the
            transcoder emitted the line) and the Kafka `topic`, `partition`
            and `offset`.
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: When the line was inserted into ClickHouse
      required: [eventId, videoId, jobId, log, metadata, timestamp]

    LogsPage:
      type: object
      properties:
        videoId:
          type: string
          format: uuid
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LogEvent"
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page follows this one
      required: [videoId, logs, limit, offset, hasMore]

    DependencyStatus:
      type: object
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: integer
        error:
          type: string
      required: [status, latencyMs]

    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
          required: [postgres, redis]
      required: [status, uptime, timestamp, dependencies]
