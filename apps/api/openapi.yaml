openapi: 3.0.3
info:
  title: video-transcoder API
  description: >
    Express + TypeScript (ESM) API with session-based authentication,
    Drizzle (Postgres), Redis and presigned S3 video uploads.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api/v1

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Registration, login and session-based authentication
  - name: Uploads
    description: Presigned upload URLs for video files

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Always returns 200 if the process is running.
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          uptime:
                            type: integer
                            description: Process uptime in seconds
                            example: 42

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Checks connectivity to Postgres and Redis.
      responses:
        "200":
          description: Ready - all dependencies are up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"
        "503":
          description: Not ready - one or more dependencies are down
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      description: On success, sets the `sid` session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=s%3A...; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        nullable: true
                        example: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /uploads/video/presign:
    post:
      tags: [Uploads]
      summary: Create a presigned S3 upload for a video file
      description: >
        Returns a presigned POST (URL + form fields) that the client posts
        the raw video file to directly. Limited to `video/mp4`, up to 100MB.
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Presigned upload created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PresignedUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Session cookie set by `POST /auth/login`.

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  details:
                    type: object
                    description: Zod flattened field errors
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        requestId:
          type: string
      required: [success, message, data]

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            success:
              type: boolean
              example: false
            data:
              nullable: true
              example: null

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, name, createdAt, updatedAt]

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [email, password, name]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    PresignedUpload:
      type: object
      properties:
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        key:
          type: string
        maxSizeBytes:
          type: integer
          example: 104857600
        contentType:
          type: string
          example: video/mp4
        expiresIn:
          type: integer
          description: Seconds until the presigned POST expires
          example: 300
      required: [url, fields, key, maxSizeBytes, contentType, expiresIn]

    DependencyStatus:
      type: object
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: integer
        error:
          type: string
      required: [status, latencyMs]

    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
          required: [postgres, redis]
      required: [status, uptime, timestamp, dependencies]
